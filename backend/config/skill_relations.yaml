# How skills relate, so a JD's requirement is judged fairly.
#
# implies: knowing the skill on the left SHOWS the skills on the right (full credit).
#   e.g. JD asks for JavaScript, your bullet says TypeScript -> JavaScript counts as shown.
#   It only works this way round: knowing JavaScript does NOT show TypeScript or Node.js.
#
# close: the JD asks for the skill on the left, your resume shows one on the right instead.
#   Not the same thing, so it earns part of the credit ("close_credit") and Matcher asks you
#   whether you have the real one. Leave a skill out if you think it shouldn't count at all.
#
# Not part of the pinned scoring settings: edits apply to new scores right away.

implies:
  TypeScript: [JavaScript]
  Node.js: [JavaScript]
  Express: [Node.js, JavaScript]
  NestJS: [Node.js, TypeScript, JavaScript]
  React: [JavaScript]
  Next.js: [React, JavaScript]
  Angular: [TypeScript, JavaScript]
  Vue: [JavaScript]
  Django: [Python]
  Flask: [Python]
  FastAPI: [Python]
  PyTorch: [Python]
  Spring Boot: [Spring, Java]
  Spring: [Java]
  PostgreSQL: [SQL]
  MySQL: [SQL]
  Kubernetes: [Docker]

close_credit: 0.5
close:
  TypeScript: [JavaScript]      # JS developers pick up TS quickly, but it isn't shown
  Node.js: [JavaScript]
  Kotlin: [Java]
  Java: [Kotlin]
  C: [C++]
  C++: [C]
  GCP: [AWS, Azure]             # another cloud
  AWS: [GCP, Azure]
  Azure: [AWS, GCP]
  MySQL: [PostgreSQL]
  PostgreSQL: [MySQL]

# Programming languages. In a JD, "Java/Go/C++" (slashes between languages) means ANY ONE of
# them; a slash between other things ("Node.js/TypeScript", "Docker/Kubernetes") means BOTH.
languages: [Java, Go, C++, C#, C, Python, Ruby, Rust, Kotlin, Scala, PHP, JavaScript, TypeScript,
            Swift, Objective-C, Dart, Elixir, Erlang, Haskell, Clojure, Perl, R, Julia, Lua]

# Extra spellings (added to config/skills_synonyms.yaml's list). "exact" ones only count with
# this capitalization ("Node" the runtime, not "a graph node").
aliases:
  Node.js: [Node]
  Async Programming: [asynchronous programming, async programming, asynchronous processing, async processing]
  Concurrency: [concurrent programming]
  Event-Driven Architecture: [event driven architecture, event driven systems]
  Data Structures and Algorithms: [DSA, data structures & algorithms]
exact: [Node]

# Kinds of tools. A JD line like "Go, Python, Java, Kubernetes, AWS or Azure" is a list of
# DIFFERENT kinds of things: it means one of the languages, AND Kubernetes, AND one of the
# clouds, not "any one of all six". Options of the same kind stay "any one of" (Kafka or RabbitMQ).
families:
  cloud: [AWS, Azure, GCP, Google Cloud, Oracle Cloud, IBM Cloud, DigitalOcean, Alibaba Cloud]
  database: [PostgreSQL, MySQL, SQL Server, Oracle, MongoDB, Cassandra, DynamoDB, MariaDB, CockroachDB,
             Couchbase, Elasticsearch, Neo4j]
  queue: [Kafka, RabbitMQ, SQS, Pulsar, Kinesis, NATS, ActiveMQ, Google Pub/Sub, Azure Service Bus]
  orchestration: [Kubernetes, ECS, EKS, AKS, GKE, Nomad, OpenShift, Docker Swarm]
  frontend: [React, Angular, Vue, Svelte, Next.js, Ember]
  ci: [Jenkins, GitHub Actions, GitLab CI, CircleCI, Travis CI, Azure DevOps, Bitbucket Pipelines, ArgoCD]
  iac: [Terraform, CloudFormation, Pulumi, Ansible, Chef, Puppet, CDK]
  monitoring: [Prometheus, Grafana, Datadog, New Relic, Splunk, ELK, OpenTelemetry, CloudWatch]
  cache: [Redis, Memcached]
  backend_framework: [Spring Boot, Django, Flask, FastAPI, Express, NestJS, Rails, Laravel, ASP.NET, Gin]

# Concepts are rarely written as one keyword: "System Design" shows in bullets about
# microservices, distributed systems, architecture, scaling. A bullet with any of these words
# counts as showing the concept (full credit, like "implies" above).
concepts:
  System Design: [system design, distributed systems, distributed system, microservices, microservice,
                  architecture, architected, scalable, scalability, high availability, fault tolerant,
                  fault tolerance, load balancing, sharding, event driven, designed and built, system architecture]
  Distributed Systems: [distributed system, microservices, microservice, sharding, replication, consensus,
                        event driven, Kafka, high availability, fault tolerant]
  Async Programming: [async, asynchronous, asyncio, async await, non blocking, coroutines, coroutine,
                      goroutines, goroutine, event loop, CompletableFuture, futures, promises, Celery,
                      message queue, message queues, Kafka, RabbitMQ, SQS, event driven, background jobs,
                      background workers, reactive, WebFlux, Tokio]
  Concurrency: [concurrent, concurrency, multithreading, multi threaded, multithreaded, goroutines,
                goroutine, threads, thread pool, parallel processing, locks, mutex, async, asynchronous,
                asyncio, coroutines, CompletableFuture, event loop]
  Event-Driven Architecture: [event driven, Kafka, RabbitMQ, SQS, SNS, pub sub, event sourcing, Kinesis, Pulsar]
  Microservices: [microservice, microservices, service oriented, SOA]
  Caching: [Redis, Memcached, cache, caching, CDN]
  CI/CD: [GitHub Actions, Jenkins, GitLab CI, CircleCI, ArgoCD, continuous integration, continuous deployment,
          continuous delivery, deployment pipeline, deployment pipelines]
  Cloud: [AWS, Azure, GCP, Google Cloud]
  Observability: [Prometheus, Grafana, Datadog, New Relic, OpenTelemetry, monitoring, alerting, tracing, ELK]
  Performance Optimization: [latency, throughput, optimized, optimised, p99, p95, performance tuning, profiling]
  Scalability: [scalable, scaled, scaling, horizontal scaling, autoscaling, high traffic, millions of]
  Data Structures and Algorithms: [algorithm, algorithms, data structures, LeetCode, competitive programming]
  API Design: [REST, RESTful, GraphQL, gRPC, API, APIs, OpenAPI]
