# Skill name normalization. canonical name: [other ways people write it]
# Matching is case-insensitive and whole-word. Add your own freely.
# Bump `version` when you change this file (it's recorded in every score).
version: 1

# Names that are also everyday English words are matched with exact capitalization
# ("Go" the language, not "go"; "React" not "react to incidents").
case_sensitive: [Go, React, Swift, Rust, Express, Spark, Helm]

